<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#FDF8F0"/>
  <!-- warm paper shadow under the book -->
  <rect x="224" y="404" width="632" height="352" rx="36" fill="#2A2631" opacity="0.12"/>
  <!-- pink spark (4-point star) -->
  <path d="M512 108 C 523 196, 538 213, 622 222 C 538 231, 523 248, 512 336 C 501 248, 486 231, 402 222 C 486 213, 501 196, 512 108 Z"
        fill="#FF6B9E" stroke="#2A2631" stroke-width="26" stroke-linejoin="round"/>
  <!-- teal sparkle dots -->
  <circle cx="700" cy="168" r="30" fill="#06D6A0" stroke="#2A2631" stroke-width="18"/>
  <circle cx="320" cy="300" r="22" fill="#06D6A0" stroke="#2A2631" stroke-width="15"/>
  <!-- bookmark ribbon -->
  <rect x="482" y="344" width="60" height="140" rx="14" fill="#FF6B9E" stroke="#2A2631" stroke-width="20"/>
  <path d="M482 456 L512 432 L542 456 L542 484 L512 460 L482 484 Z" fill="#FDF8F0" stroke="#2A2631" stroke-width="14" stroke-linejoin="round"/>
  <!-- open book: left page -->
  <rect x="212" y="392" width="296" height="344" rx="32" fill="#FFFFFF" stroke="#2A2631" stroke-width="28"/>
  <!-- open book: right page -->
  <rect x="516" y="392" width="296" height="344" rx="32" fill="#FFFFFF" stroke="#2A2631" stroke-width="28"/>
  <!-- spine crease -->
  <line x1="512" y1="414" x2="512" y2="714" stroke="#2A2631" stroke-width="10" stroke-linecap="round" opacity="0.30"/>
  <!-- writing lines: left page -->
  <line x1="256" y1="480" x2="464" y2="480" stroke="#8A828F" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
  <line x1="256" y1="560" x2="464" y2="560" stroke="#8A828F" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
  <line x1="256" y1="640" x2="404" y2="640" stroke="#8A828F" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
  <!-- writing lines: right page -->
  <line x1="560" y1="480" x2="768" y2="480" stroke="#8A828F" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
  <line x1="560" y1="560" x2="768" y2="560" stroke="#8A828F" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
  <line x1="560" y1="640" x2="700" y2="640" stroke="#8A828F" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
</svg>
